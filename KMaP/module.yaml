product:
  type: kmp/lib
  platforms: [android, jvm, js, wasmJs, iosArm64, iosSimulatorArm64]

apply:
  - ../templates/common.module-template.yaml

description: A flexible and powerful Compose Multiplatform mapping library.

dependencies:
  - $compose.foundation
  - $libs.kotlinx.coroutines.core
  - $kotlin.serialization.json
  - $kotlin.serialization.protobuf

test-dependencies:
  - $libs.testBalloon.framework.core
  - $compose.desktop.currentOs

test-settings:
  junit: none
  jvm:
    test:
      extraEnvironment:
        # Kotlin CLI class discovery does not discover TestBalloon's top-level suites.
        - TESTBALLOON_INCLUDE_PATTERNS: '*'
  kotlin:
    compilerPlugins:
      - id: de.infix.testBalloon
        dependency: $libs.testBalloon.compiler.plugin

settings:
  android:
    namespace: com.rafambn.KMaP
    compileSdk: 37
    minSdk: 24
  jvm:
    jdk:
      version: 25
    release: 17
  kotlin:
    serialization:
      enabled: true
      version: 1.11.0
  publishing:
    enabled: true
    group: com.rafambn
    artifactId: KMaP
    version: 0.5.0
    mavenCentral: enabled
    signArtifacts: true
    publishSources: true
    pom:
      name: KMaP
      description: A flexible and powerful Compose Multiplatform mapping library.
      url: https://kmap.rafambn.com
      licenses:
        - name: Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0
      developers:
        - id: rafambn
          name: Rafael Mendonca
          email: rafambn@gmail.com
      scm: https://github.com/rafambn/KMaP
